name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # grape never picks Apple's MPS GPU, so this runs on the CPU too.
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install CPU-only torch explicitly. The default torch wheel on PyPI
      # pulls in ~2 GB of CUDA libraries we don't need and which inflate
      # CI install time dramatically.
      - name: Install CPU-only torch
        if: runner.os == 'Linux'  # macOS wheels on PyPI have no CUDA
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install project and dev/browser deps
        run: pip install -e .[dev] playwright

      - name: Install Firefox for Playwright
        run: playwright install firefox

      # Cache the test models' weights across runs (CLIP ViT-B-32, and the
      # smallest SigLIP 2 for grape.textfast). Key is static because the
      # checkpoints are immutable; a fresh key forces a re-download.
      - name: Cache HuggingFace Hub
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-vit-b-32-laion2b-siglip2-b-32-v1

      - name: Run tests (including @pytest.mark.slow)
        run: pytest
